name: Padrón RUC

# Cada día baja el padrón reducido del RUC que publica SUNAT, lo convierte en un
# índice por bloques (backend/scripts/padron-build.mjs) y lo sube al bucket que
# lee la API (PADRON_URL). Si SUNAT no publicó un archivo nuevo, no hace nada.
#
# Variable del repo: GCP_PADRON_BUCKET (bucket de Cloud Storage).
# La cuenta de despliegue necesita roles/storage.objectAdmin sobre ese bucket.

on:
  schedule:
    # 05:40 de Lima: SUNAT publica el padrón de madrugada.
    - cron: '40 10 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Regenerar aunque el archivo de SUNAT no haya cambiado
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: padron-ruc
  cancel-in-progress: false

jobs:
  build:
    name: Generar y publicar el índice
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_URL: https://www2.sunat.gob.pe/padron_reducido_ruc.zip
      DEST: gs://${{ vars.GCP_PADRON_BUCKET }}/padron
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: ¿Hay un padrón nuevo?
        id: check
        run: |
          etag="$(curl -sSfI "$SOURCE_URL" | tr -d '\r' | awk 'tolower($1)=="etag:" {print $2}' | tr -d '"')"
          [ -n "$etag" ] || { echo "::error::SUNAT no devolvió el ETag del padrón"; exit 1; }
          current="$(gcloud storage cat "$DEST/current.json" 2>/dev/null || true)"
          echo "etag=$etag" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" != "true" ] && echo "$current" | grep -q "\"etag\": *\"$etag\""; then
            echo "El padrón publicado ya es el vigente ($etag)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.check.outputs.changed == 'true'
        with:
          node-version-file: backend/.nvmrc

      - name: Descargar y generar el índice
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -sSfL --retry 3 -o padron.zip "$SOURCE_URL"
          unzip -o -q padron.zip
          rm padron.zip
          version="$(TZ=America/Lima date +%F)"
          node backend/scripts/padron-build.mjs padron_reducido_ruc.txt out --version "$version"
          # Cada publicación va a su propia carpeta: nunca se pisan los archivos
          # que una instancia de la API ya está leyendo con su índice en memoria.
          echo "FOLDER=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - name: Publicar
        if: steps.check.outputs.changed == 'true'
        run: |
          gcloud storage cp out/data.bin out/index.bin out/manifest.json "$DEST/$FOLDER/"
          # El puntero se cambia al final: la API nunca lee una versión a medio subir.
          printf '{"path": "%s", "etag": "%s"}\n' "$FOLDER" "${{ steps.check.outputs.etag }}" > current.json
          gcloud storage cp --cache-control=no-store current.json "$DEST/current.json"
          # Quedan las dos últimas publicaciones (la anterior la siguen leyendo
          # las instancias hasta que recargan, a lo sumo 10 minutos).
          gcloud storage ls "$DEST/" | grep -E '/[0-9]{8}T[0-9]{6}Z/$' | sort | head -n -2 | while read -r old; do
            gcloud storage rm -r "$old"
          done
          # La carpeta con nombre de fecha es de la primera carga, a mano.
          gcloud storage ls "$DEST/" | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}/$' | while read -r old; do
            gcloud storage rm -r "$old"
          done
