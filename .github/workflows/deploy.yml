name: Deploy

# Push a main -> CI -> migraciones -> imagen -> Cloud Run -> smoke test.
# Autenticación con GCP por Workload Identity Federation (sin llaves JSON):
# el proveedor solo acepta tokens de este repo y de refs/heads/main.
#
# Variables del repo (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_RUN_SA,
#   GCP_AR_REPO, CLOUD_RUN_SERVICE
# Los secretos (URLs de Neon) viven en Secret Manager, no en GitHub.

on:
  push:
    branches: [main]
    # Cambios solo de documentación no redespliegan.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # para el token OIDC que canjea Workload Identity Federation

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en Cloud Run
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      # ---- Migraciones (antes de la nueva revisión: expand -> deploy) ----
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones Prisma
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=database-url --project="$PROJECT_ID")"
          DIRECT_DATABASE_URL="$(gcloud secrets versions access latest --secret=direct-database-url --project="$PROJECT_ID")"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DIRECT_DATABASE_URL"
          export DATABASE_URL DIRECT_DATABASE_URL
          pnpm exec prisma migrate deploy

      # ---- Imagen ----
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Un solo manifiesto por build (sin índice ni atestaciones): la política
          # de limpieza de Artifact Registry cuenta "versiones" y las atestaciones
          # podrían desplazar a la imagen que Cloud Run está sirviendo.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Cloud Run ----
      # --cpu-throttling = facturación por request (la que cubre la capa gratis).
      # --max-instances acota el costo; --min-instances 0 permite escalar a cero.
      - name: Desplegar
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE:${{ github.sha }}" \
            --service-account="${{ vars.GCP_RUN_SA }}" \
            --execution-environment=gen2 \
            --cpu=1 \
            --memory=1Gi \
            --cpu-throttling \
            --concurrency=20 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=60 \
            --port=8080 \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production,LOG_LEVEL=info,SHALOM_CAPTCHA_PROVIDER=playwright" \
            --set-secrets="DATABASE_URL=database-url:latest" \
            --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "Servicio: $URL"
          for i in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$URL/health")"
            [ "$code" = "200" ] && { echo "health OK"; exit 0; }
            echo "intento $i: HTTP $code"; sleep 5
          done
          echo "::error::El servicio no respondió 200 en /health"; exit 1
