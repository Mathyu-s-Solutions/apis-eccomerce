name: Guías SEO

# Motor de contenido: lunes, miércoles y viernes Claude escribe la próxima guía del backlog
# (frontend/content/seo/backlog.json) con los datos reales del producto, la revisa sola
# (chequeos fijos + un segundo pedido como editor, con hasta 2 correcciones) y:
#   - si pasa, la publica directo en main (Vercel la despliega y entra al sitemap);
#   - si no, abre un PR con los problemas pendientes para que alguien decida.
# Cuando quedan pocos temas, el mismo commit trae ideas nuevas para el backlog.
#
# Secreto del repo: ANTHROPIC_API_KEY.
# Variable del repo: PUBLIC_API_URL (URL pública de la API para los ejemplos).
# Settings → Actions → General: "Read and write permissions" y "Allow GitHub Actions to
# create and approve pull requests" (para el caso del PR).
# Para pausarlo: Actions → Guías SEO → Disable workflow.

on:
  schedule:
    # Lunes, miércoles y viernes a las 09:00 de Lima.
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:
    inputs:
      slug:
        description: Tema concreto del backlog (vacío = el siguiente pendiente)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-guides
  cancel-in-progress: false

jobs:
  guide:
    name: Escribir, revisar y publicar la guía
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      # `prisma generate` (postinstall) necesita la variable; no se conecta a nada.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Escribir y revisar la guía
        id: guide
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
          SLUG: ${{ inputs.slug }}
        run: node scripts/seo/write-guide.mjs ${SLUG:+--slug "$SLUG"}

      - name: Publicar en main
        if: steps.guide.outputs.publish == 'true'
        env:
          TITLE: ${{ steps.guide.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/guias content/seo/backlog.json
          git commit -m "content(guias): $TITLE"
          # Si alguien subió algo mientras corría, se acomoda encima.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Abrir PR (no pasó la revisión)
        if: steps.guide.outputs.slug != '' && steps.guide.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.guide.outputs.slug }}
          TITLE: ${{ steps.guide.outputs.title }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1. A main va solo el backlog (el tema marcado y las ideas nuevas): el motor sigue
          #    con otro tema la próxima vez en vez de reintentar este.
          git add content/seo/backlog.json
          git commit -m "content(seo): \"$SLUG\" queda para revisión"
          git pull --rebase origin main
          git push origin HEAD:main
          # 2. La guía espera en su PR.
          branch="seo/guia-$SLUG"
          git switch -c "$branch"
          git add content/guias
          git commit -m "content(guias): $TITLE"
          git push --force -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Guía para revisar: $TITLE" --body-file "$NOTES_FILE" \
            || gh pr edit "$branch" --body-file "$NOTES_FILE"

      - name: Resumen
        if: always() && steps.guide.outputs.slug != ''
        env:
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"
