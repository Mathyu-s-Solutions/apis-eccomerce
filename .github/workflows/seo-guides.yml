name: Guías SEO

# Motor de contenido: lunes, miércoles y viernes GitHub Copilot (Copilot CLI) escribe la
# próxima guía del backlog (frontend/content/seo/backlog.json) con los datos reales del
# producto, la revisa sola (chequeos fijos + un segundo pedido como editor, con hasta 2
# correcciones) y:
#   - si pasa, la publica directo en main (Vercel la despliega y entra al sitemap);
#   - si no, la deja en una rama y abre un issue con lo pendiente para que alguien decida.
# Cuando quedan pocos temas, el mismo commit trae ideas nuevas para el backlog.
# Usa los créditos incluidos en el plan de Copilot del dueño del token: sin costo aparte.
#
# Secreto del repo: COPILOT_GITHUB_TOKEN (fine-grained PAT de una cuenta con Copilot, con el
#   permiso de cuenta "Copilot Requests").
# Variables del repo: PUBLIC_API_URL (URL pública de la API para los ejemplos) y, opcional,
#   COPILOT_MODEL (sin ella, Copilot elige el modelo: modo "auto").
# Los permisos los pide el propio workflow (abajo): no hace falta tocar Settings → Actions.
# Para pausarlo: Actions → Guías SEO → Disable workflow.

on:
  schedule:
    # Lunes, miércoles y viernes a las 09:00 de Lima.
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:
    inputs:
      slug:
        description: Tema concreto del backlog (vacío = el siguiente pendiente)
        type: string
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: seo-guides
  cancel-in-progress: false

jobs:
  guide:
    name: Escribir, revisar y publicar la guía
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      # `prisma generate` (postinstall) necesita la variable; no se conecta a nada.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot@1.0.107

      - name: Escribir y revisar la guía
        id: guide
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
          SLUG: ${{ inputs.slug }}
        run: node scripts/seo/write-guide.mjs ${SLUG:+--slug "$SLUG"}

      - name: Publicar en main
        if: steps.guide.outputs.publish == 'true'
        env:
          TITLE: ${{ steps.guide.outputs.title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/guias content/seo/backlog.json
          git commit -m "content(guias): $TITLE"
          # Si alguien subió algo mientras corría, se acomoda encima.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Dejar la guía para revisión (no pasó)
        if: steps.guide.outputs.slug != '' && steps.guide.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ steps.guide.outputs.slug }}
          TITLE: ${{ steps.guide.outputs.title }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
          BODY_FILE: ${{ runner.temp }}/issue.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1. A main va solo el backlog (el tema marcado y las ideas nuevas): el motor sigue
          #    con otro tema la próxima vez en vez de reintentar este.
          git add content/seo/backlog.json
          git commit -m "content(seo): \"$SLUG\" queda para revisión"
          git pull --rebase origin main
          git push origin HEAD:main
          # 2. La guía espera en su rama. La organización no deja que Actions abra PRs, así
          #    que se abre un issue con lo pendiente y el link para crear el PR en un clic.
          branch="seo/guia-$SLUG"
          git switch -c "$branch"
          git add content/guias
          git commit -m "content(guias): $TITLE"
          git push --force -u origin "$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          {
            cat "$NOTES_FILE"
            echo
            echo "**Para publicarla:** [abre el PR desde la rama \`$branch\`]($compare), corrige lo pendiente y haz merge. Para descartarla, borra la rama y cierra este issue."
          } > "$BODY_FILE"
          gh issue create --title "Guía para revisar: $TITLE" --body-file "$BODY_FILE"

      - name: Resumen
        if: always() && steps.guide.outputs.slug != ''
        env:
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: cat "$NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"
